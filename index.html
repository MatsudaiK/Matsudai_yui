<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0e15;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }

        /* Avatar Container */
        .avatar-box {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        /* Animated Glowing AI Core representing our companion */
        .avatar-core {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #a1c4fd 0%, #c2e9fb 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #a1c4fd, 0 0 80px #c2e9fb;
            transition: all 0.3s ease;
            position: relative;
        }

        .avatar-core.thinking {
            animation: pulse 1s infinite alternate;
            background: radial-gradient(circle, #fbc2eb 0%, #a6c1ee 100%);
            box-shadow: 0 0 50px #fbc2eb, 0 0 90px #a6c1ee;
        }

        .avatar-core.speaking {
            animation: speakWave 0.2s infinite alternate;
            background: radial-gradient(circle, #84fab0 0%, #8fd3f4 100%);
            box-shadow: 0 0 60px #84fab0, 0 0 100px #8fd3f4;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        @keyframes speakWave {
            0% { transform: scale(1) skewX(-3deg); }
            100% { transform: scale(1.2) skewX(3deg); }
        }

        /* Status & Text Output */
        .display-panel {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
        }

        .status-text {
            font-size: 0.85rem;
            color: #a1c4fd;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle-box {
            font-size: 1.1rem;
            line-height: 1.4;
            max-height: 100px;
            overflow-y: auto;
            color: #e2e8f0;
        }

        /* Controls */
        .control-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }

        .key-input {
            width: 85%;
            max-width: 360px;
            background: #1a1c24;
            border: 1px solid #333644;
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .mic-btn {
            width: 76px;
            height: 76px;
            background: #2563eb;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        .mic-btn:active {
            transform: scale(0.95);
        }

        .mic-btn.listening {
            background: #dc2626;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
        }
    </style>
</head>
<body>

    <div class="avatar-box">
        <div id="avatar" class="avatar-core"></div>
    </div>

    <div class="display-panel">
        <div id="status" class="status-text">Ready</div>
        <div id="subtitles" class="subtitle-box">Tap the microphone to start talking.</div>
    </div>

    <div class="control-panel">
        <input type="password" id="apiKey" class="key-input" placeholder="Paste Gemini or Groq API Key Here">
        <button id="micBtn" class="mic-btn">🎙️</button>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const avatar = document.getElementById('avatar');
        const statusText = document.getElementById('status');
        const subtitles = document.getElementById('subtitles');
        const apiKeyInput = document.getElementById('apiKey');

        // Setup native Android speech recognition tools built into the browser
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                setUIState('Listening...', 'Speak clearly into your phone...');
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
            };

            recognition.onresult = async (event) => {
                const userText = event.results[0][0].transcript;
                setUIState('Thinking...', `You: "${userText}"`);
                avatar.className = 'avatar-core thinking';
                
                await getAIResponse(userText);
            };

            recognition.onerror = (event) => {
                console.log("Speech recognition error:", event.error);
                isListening = false;
                micBtn.classList.remove('listening');
                if (event.error === 'not-allowed') {
                    setUIState('Error', 'Microphone permission denied. Please allow mic access in your browser settings.');
                } else {
                    setUIState('Ready', 'Tap the mic to try talking again.');
                }
                avatar.className = 'avatar-core';
            };
        } else {
            subtitles.innerText = "Speech recognition is not supported in this browser. Please use Chrome on Android.";
        }

        // Updated, error-proof microphone toggle button logic
        micBtn.addEventListener('click', () => {
            if (!SpeechRecognition) return;
            
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    window.speechSynthesis.cancel();
                    avatar.className = 'avatar-core';
                    recognition.start();
                } catch (e) {
                    console.log("Mic reset triggered to prevent double-start crash.");
                    recognition.stop();
                }
            }
        });

        function setUIState(status, text) {
            statusText.innerText = status;
            subtitles.innerText = text;
        }

        // Call the AI Brain
        async function getAIResponse(prompt) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                avatar.className = 'avatar-core';
                setUIState('Error', 'Please paste a free API key in the input box below to give the companion a brain.');
                return;
            }

            try {
                const url = `https://googleapis.com{apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are Yui, an affectionate, helpful, and highly intelligent AI companion from Sword Art Online. Keep your answers brief, warm, and natural for a voice conversation. User says: ${prompt}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                const replyText = data.candidates[0].content.parts[0].text;
                
                speak(replyText);
            } catch (err) {
                avatar.className = 'avatar-core';
                setUIState('Error', 'Failed to reach the AI brain. Double-check your API key.');
            }
        }

        // Voice output function using Android's native Text-to-Speech system
        function speak(text) {
            avatar.className = 'avatar-core speaking';
            setUIState('Yui Speaking', text);

            const utterance = new SpeechSynthesisUtterance(text);
            
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('google us english') || v.lang.startsWith('en-'));
            if (femaleVoice) utterance.voice = femaleVoice;

            utterance.onend = () => {
                avatar.className = 'avatar-core';
                setUIState('Ready', 'Tap the mic to talk again.');
            };

            window.speechSynthesis.speak(utterance);
        }

        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
